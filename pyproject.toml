[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "incogni-clone"
version = "0.2.0"
description = "A data-removal service clone: scan data brokers for your PII and automate opt-out requests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "argon2-cffi>=23.1",
    "cryptography>=42",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
service = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.2",
    "playwright>=1.45",
]
test = ["httpx>=0.27"]

[project.scripts]
incogni = "incogni.cli:main"

[tool.setuptools]
packages = ["incogni", "incogni.adapters"]

[tool.setuptools.package-data]
incogni = ["data/brokers.json", "fixtures/soak/*/*.html"]
